version: 2.1

orbs:
  windows: circleci/windows@5.1.1

jobs:

  build-linux:
    machine:
      image: ubuntu-2404:current
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Checkout submodules
          command: git submodule update --init --recursive
      - restore_cache:
          keys:
            - linux-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-ccache-{{ .Branch }}-
            - linux-ccache-
      - run:
          name: Install dependencies
          command: |
            sudo add-apt-repository -y ppa:obsproject/obs-studio
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              libobs-dev \
              qt6-base-dev libqt6svg6-dev qt6-tools-dev \
              libcairo2-dev libpango1.0-dev libminizip-dev libssl-dev
      - restore_cache:
          keys:
            - cpm-sources-v1
      - run:
          name: Configure
          command: |
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCPM_SOURCE_CACHE=~/.cpm
      - run:
          name: Build
          command: cmake --build build --parallel
      - save_cache:
          key: cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - save_cache:
          key: linux-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always
      - run:
          name: Package
          command: |
            if [ -z "$CIRCLE_TAG" ]; then echo "Not a tag — skipping"; exit 0; fi
            mkdir -p artifacts
            # Only the obs-plugins dirs are the actual plugin; the rest of
            # dist/ is install() output from CPM-fetched dependencies (curl,
            # mbedtls, ...) that isn't meant to ship to end users.
            plugin_dirs=$(cd dist && find . -type d -name obs-plugins | sed 's#^\./##')
            if [ -z "$plugin_dirs" ]; then
              echo "No obs-plugins directories found under dist/ — packaging aborted" >&2
              exit 1
            fi
            tar -czf "artifacts/plugin-${CIRCLE_TAG}-linux-x86_64.tar.gz" -C dist $plugin_dirs
      - store_artifacts:
          path: artifacts
          destination: releases

  build-windows:
    executor:
      name: windows/default
      size: medium
      shell: powershell.exe
    environment:
      SCCACHE_DIR: C:\sccache
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
    steps:
      - checkout
      - run:
          name: Checkout submodules
          shell: bash.exe
          command: git submodule update --init --recursive
      - run:
          name: Prepare vcpkg cache dirs
          command: |
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
      - restore_cache:
          keys:
            - windows-deps-{{ checksum "buildspec.json" }}
            - windows-deps-
      - restore_cache:
          keys:
            - windows-vcpkg-tool-v1
      - restore_cache:
          keys:
            - windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-
            - windows-vcpkg-archives-
      - restore_cache:
          keys:
            - windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-
      - restore_cache:
          keys:
            - windows-vcpkg-downloads-
      - restore_cache:
          keys:
            - windows-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-sccache-{{ .Branch }}-
            - windows-sccache-
      - restore_cache:
          keys:
            - windows-cpm-sources-v1
      - run:
          name: Install build tools
          command: |
            choco install cmake sccache -y --no-progress
            choco install pkgconfiglite -y --no-progress --checksum64=2038c49d23b5ca19e2218ca89f06df18fe6d870b4c6b54c0498548ef88771f6f
      - run:
          name: Bootstrap vcpkg
          command: |
            if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
      - save_cache:
          key: windows-vcpkg-tool-v1
          paths: [C:\vcpkg]
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet x64-windows `
              --x-manifest-root="$PWD" `
              --x-install-root="$PWD\build_x64\vcpkg_installed"
      - save_cache:
          key: windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [C:\vcpkg-archives]
          when: always
      - save_cache:
          key: windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [build_x64/vcpkg_installed]
          when: always
      - save_cache:
          key: windows-vcpkg-downloads-{{ epoch }}
          paths: [C:\vcpkg-downloads]
          when: always
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            $env:PKG_CONFIG_PATH = "$install_dir\x64-windows\lib\pkgconfig"
            cmake -S . -B build_x64 `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$install_dir" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
              "-DCPM_SOURCE_CACHE=$env:USERPROFILE\.cpm"
      - run:
          name: Build
          command: cmake --build build_x64 --config RelWithDebInfo --parallel
      - save_cache:
          key: windows-cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install
          command: cmake --install build_x64 --config RelWithDebInfo --prefix dist
      - run:
          name: sccache stats
          command: sccache --show-stats
          when: always
      - store_artifacts:
          path: dist
          destination: windows-x64
      - save_cache:
          key: windows-deps-{{ checksum "buildspec.json" }}
          paths: [.deps]
          when: always
      - save_cache:
          key: windows-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always
      - run:
          name: Package (ZIP)
          command: |
            $ErrorActionPreference = "Stop"
            if (-not $env:CIRCLE_TAG) { Write-Output "Not a tag — skipping"; exit 0 }
            $tag = $env:CIRCLE_TAG
            $root = $PWD.Path
            New-Item -ItemType Directory -Path artifacts -Force | Out-Null
            $zipPath = Join-Path $root "artifacts\plugin-$tag-windows-x64.zip"
            $pluginDir = Join-Path $root "dist\stream-canvas"
            if (-not (Test-Path $pluginDir)) {
              Write-Error "$pluginDir not found — packaging aborted"
              exit 1
            }
            # Only dist\stream-canvas is the actual plugin; dist\bin, \include,
            # \lib, \share are install() output from CPM-fetched dependencies
            # (curl, mbedtls, ...) that isn't meant to ship to end users.
            Push-Location (Join-Path $root "dist")
            7z a -tzip $zipPath ".\stream-canvas" -mx=5
            $exitCode = $LASTEXITCODE
            Pop-Location
            if ($exitCode -ne 0) {
              Write-Error "7z packaging failed with exit code $exitCode"
              exit 1
            }
      - store_artifacts:
          path: artifacts
          destination: releases

workflows:
  build:
    jobs:
      - build-linux:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      - build-windows:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
