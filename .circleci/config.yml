version: 2.1

orbs:
  windows: circleci/windows@5.1.1

commands:
  upload_to_minio:
    parameters:
      component:
        type: string
      linux_ext:
        type: string
        default: tar.gz
      windows_ext:
        type: string
        default: zip
      shell:
        type: enum
        enum: [bash, powershell]
        default: bash
    steps:
      - when:
          condition:
            equal: [bash, << parameters.shell >>]
          steps:
            - run:
                name: Upload << parameters.component >> (linux) to MinIO
                command: |
                  if [ -z "$CIRCLE_TAG" ]; then echo "Not a tag — skipping"; exit 0; fi
                  curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                  unzip -q /tmp/awscliv2.zip -d /tmp
                  sudo /tmp/aws/install --update
                  export AWS_ACCESS_KEY_ID="$MINIO_ACCESS_KEY_ID"
                  export AWS_SECRET_ACCESS_KEY="$MINIO_SECRET_ACCESS_KEY"
                  COMP="<< parameters.component >>"
                  EXT="<< parameters.linux_ext >>"
                  WEXT="<< parameters.windows_ext >>"
                  TAG="$CIRCLE_TAG"
                  FILE="artifacts/${COMP}-${TAG}-linux-x86_64.${EXT}"
                  aws s3 cp "$FILE" \
                    "s3://releases/${COMP}/${COMP}-${TAG}-linux-x86_64.${EXT}" \
                    --endpoint-url "$MINIO_S3_ENDPOINT" --region us-east-1
                  aws s3 cp s3://releases/manifest.json /tmp/manifest.json \
                    --endpoint-url "$MINIO_S3_ENDPOINT" --region us-east-1 2>/dev/null \
                    || echo '{}' > /tmp/manifest.json
                  python3 \<< 'PYEOF'
                  import json, os
                  tag  = os.environ['CIRCLE_TAG']
                  comp = os.environ['COMP']
                  ext  = os.environ['EXT']
                  wext = os.environ['WEXT']
                  try:
                      with open('/tmp/manifest.json') as f:
                          m = json.load(f)
                  except Exception:
                      m = {}
                  m[comp] = {
                      'linux_x86_64': f'{comp}-{tag}-linux-x86_64.{ext}',
                      'windows_x64':  f'{comp}-{tag}-windows-x64.{wext}',
                  }
                  with open('/tmp/manifest.json', 'w') as f:
                      json.dump(m, f, indent=2)
                  PYEOF
                  aws s3 cp /tmp/manifest.json s3://releases/manifest.json \
                    --endpoint-url "$MINIO_S3_ENDPOINT" --region us-east-1 \
                    --content-type application/json
      - when:
          condition:
            equal: [powershell, << parameters.shell >>]
          steps:
            - run:
                name: Upload << parameters.component >> (windows) to MinIO
                shell: powershell.exe
                command: |
                  if (-not $env:CIRCLE_TAG) { Write-Output "Not a tag — skipping"; exit 0 }
                  $tag  = $env:CIRCLE_TAG
                  $comp = '<< parameters.component >>'
                  $ext  = '<< parameters.windows_ext >>'
                  $env:AWS_ACCESS_KEY_ID     = $env:MINIO_ACCESS_KEY_ID
                  $env:AWS_SECRET_ACCESS_KEY = $env:MINIO_SECRET_ACCESS_KEY

                  $file = "artifacts\$comp-$tag-windows-x64.$ext"
                  aws s3 cp $file `
                    "s3://releases/$comp/$comp-$tag-windows-x64.$ext" `
                    --endpoint-url $env:MINIO_S3_ENDPOINT --region us-east-1

                  try {
                    aws s3 cp s3://releases/manifest.json "$env:TEMP\manifest.json" `
                      --endpoint-url $env:MINIO_S3_ENDPOINT --region us-east-1 2>$null
                  } catch {}
                  if (-not (Test-Path "$env:TEMP\manifest.json")) {
                    '{}' | Set-Content "$env:TEMP\manifest.json"
                  }

                  $linExt = '<< parameters.linux_ext >>'
                  $m = Get-Content "$env:TEMP\manifest.json" | ConvertFrom-Json
                  $m | Add-Member -NotePropertyName $comp -NotePropertyValue ([PSCustomObject]@{
                    linux_x86_64 = "$comp-$tag-linux-x86_64.$linExt"
                    windows_x64  = "$comp-$tag-windows-x64.$ext"
                  }) -Force
                  $m | ConvertTo-Json -Depth 5 | Set-Content "$env:TEMP\manifest_new.json"

                  aws s3 cp "$env:TEMP\manifest_new.json" s3://releases/manifest.json `
                    --endpoint-url $env:MINIO_S3_ENDPOINT --region us-east-1 `
                    --content-type application/json

jobs:

  build-linux:
    machine:
      image: ubuntu-2404:current
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Checkout submodules
          command: git submodule update --init --recursive
      - restore_cache:
          keys:
            - linux-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-ccache-{{ .Branch }}-
            - linux-ccache-
      - run:
          name: Install dependencies
          command: |
            sudo add-apt-repository -y ppa:obsproject/obs-studio
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              libobs-dev \
              qt6-base-dev libqt6svg6-dev qt6-tools-dev \
              libcairo2-dev libpango1.0-dev libminizip-dev
      - restore_cache:
          keys:
            - cpm-sources-v1
      - run:
          name: Configure
          command: |
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCPM_SOURCE_CACHE=~/.cpm
      - run:
          name: Build
          command: cmake --build build --parallel
      - save_cache:
          key: cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - save_cache:
          key: linux-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always
      - run:
          name: Package
          command: |
            if [ -z "$CIRCLE_TAG" ]; then echo "Not a tag — skipping"; exit 0; fi
            mkdir -p artifacts
            tar -czf "artifacts/plugin-${CIRCLE_TAG}-linux-x86_64.tar.gz" -C dist .
      - store_artifacts:
          path: artifacts
          destination: releases
      - upload_to_minio:
          component: plugin

  build-windows:
    executor:
      name: windows/default
      size: medium
      shell: powershell.exe
    environment:
      SCCACHE_DIR: C:\sccache
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
    steps:
      - checkout
      - run:
          name: Checkout submodules
          shell: bash.exe
          command: git submodule update --init --recursive
      - run:
          name: Prepare vcpkg cache dirs
          command: |
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
      - restore_cache:
          keys:
            - windows-deps-{{ checksum "buildspec.json" }}
            - windows-deps-
      - restore_cache:
          keys:
            - windows-vcpkg-tool-v1
      - restore_cache:
          keys:
            - windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-
            - windows-vcpkg-archives-
      - restore_cache:
          keys:
            - windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-
      - restore_cache:
          keys:
            - windows-vcpkg-downloads-
      - restore_cache:
          keys:
            - windows-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-sccache-{{ .Branch }}-
            - windows-sccache-
      - restore_cache:
          keys:
            - windows-cpm-sources-v1
      - run:
          name: Install build tools
          command: choco install cmake pkgconfiglite sccache awscli -y --no-progress
      - run:
          name: Bootstrap vcpkg
          command: |
            if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
      - save_cache:
          key: windows-vcpkg-tool-v1
          paths: [C:\vcpkg]
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet x64-windows `
              --x-manifest-root="$PWD" `
              --x-install-root="$PWD\build_x64\vcpkg_installed"
      - save_cache:
          key: windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [C:\vcpkg-archives]
          when: always
      - save_cache:
          key: windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [build_x64/vcpkg_installed]
          when: always
      - save_cache:
          key: windows-vcpkg-downloads-{{ epoch }}
          paths: [C:\vcpkg-downloads]
          when: always
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            $env:PKG_CONFIG_PATH = "$install_dir\x64-windows\lib\pkgconfig"
            cmake -S . -B build_x64 `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$install_dir" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
              "-DCPM_SOURCE_CACHE=$env:USERPROFILE\.cpm"
      - run:
          name: Build
          command: cmake --build build_x64 --config RelWithDebInfo --parallel
      - save_cache:
          key: windows-cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install
          command: cmake --install build_x64 --config RelWithDebInfo --prefix dist
      - run:
          name: sccache stats
          command: sccache --show-stats
          when: always
      - store_artifacts:
          path: dist
          destination: windows-x64
      - save_cache:
          key: windows-deps-{{ checksum "buildspec.json" }}
          paths: [.deps]
          when: always
      - save_cache:
          key: windows-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always
      - run:
          name: Package (ZIP)
          command: |
            if (-not $env:CIRCLE_TAG) { Write-Output "Not a tag — skipping"; exit 0 }
            $tag = $env:CIRCLE_TAG
            New-Item -ItemType Directory -Path artifacts -Force | Out-Null
            Compress-Archive -Path dist -DestinationPath "artifacts\plugin-$tag-windows-x64.zip"
      - store_artifacts:
          path: artifacts
          destination: releases
      - upload_to_minio:
          component: plugin
          shell: powershell

workflows:
  build:
    jobs:
      - build-linux:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
      - build-windows:
          filters:
            tags:
              only: /.*/
            branches:
              only: /.*/
