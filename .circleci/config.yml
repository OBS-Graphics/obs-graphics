version: 2.1

orbs:
  windows: circleci/windows@5.1.1

jobs:

  build-linux:
    machine:
      image: ubuntu-2404:current
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Checkout submodules
          command: git submodule update --init --recursive
      - restore_cache:
          keys:
            - linux-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-ccache-{{ .Branch }}-
            - linux-ccache-
      - run:
          name: Install dependencies
          command: |
            sudo add-apt-repository -y ppa:obsproject/obs-studio
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              libobs-dev \
              qt6-base-dev libqt6svg6-dev qt6-tools-dev \
              libcairo2-dev libpango1.0-dev
      - run:
          name: Configure
          command: |
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run:
          name: Build
          command: cmake --build build --parallel
      - run:
          name: Install
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - save_cache:
          key: linux-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always

  build-macos:
    macos:
      xcode: "16.1.0"
    resource_class: macos.m1.medium.gen1
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Checkout submodules
          command: git submodule update --init --recursive
      - restore_cache:
          keys:
            - macos-deps-{{ checksum "buildspec.json" }}
            - macos-deps-
      - restore_cache:
          keys:
            - macos-ccache-{{ .Branch }}-{{ .Revision }}
            - macos-ccache-{{ .Branch }}-
            - macos-ccache-
      - run:
          name: Install build tools
          command: brew install cmake ccache
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            cmake -S . -B build \
              -G Xcode \
              -DENABLE_CCACHE=ON
      - run:
          name: Build
          command: cmake --build build --config RelWithDebInfo --parallel
      - run:
          name: Install
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: macos
      - save_cache:
          key: macos-deps-{{ checksum "buildspec.json" }}
          paths: [.deps]
          when: always
      - save_cache:
          key: macos-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always

  build-windows:
    executor:
      name: windows/default
      size: medium
      shell: powershell.exe
    environment:
      SCCACHE_DIR: C:\sccache
    steps:
      - checkout
      - run:
          name: Checkout submodules
          shell: bash.exe
          command: git submodule update --init --recursive
      - restore_cache:
          keys:
            - windows-deps-{{ checksum "buildspec.json" }}
            - windows-deps-
      - restore_cache:
          keys:
            - windows-vcpkg-{{ checksum "vcpkg.json" }}
            - windows-vcpkg-
      - restore_cache:
          keys:
            - windows-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-sccache-{{ .Branch }}-
            - windows-sccache-
      - run:
          name: Install build tools
          command: choco install cmake pkgconfiglite sccache -y --no-progress
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            & "$vcpkg\vcpkg.exe" install --triplet x64-windows --x-install-root="$install_dir"
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            $env:PKG_CONFIG_PATH = "$install_dir\x64-windows\lib\pkgconfig"
            cmake -S . -B build_x64 `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$install_dir" `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - run:
          name: Build
          command: cmake --build build_x64 --config RelWithDebInfo --parallel
      - run:
          name: Install
          command: cmake --install build_x64 --config RelWithDebInfo --prefix dist
      - run:
          name: sccache stats
          command: sccache --show-stats
          when: always
      - store_artifacts:
          path: dist
          destination: windows-x64
      - save_cache:
          key: windows-deps-{{ checksum "buildspec.json" }}
          paths: [.deps]
          when: always
      - save_cache:
          key: windows-vcpkg-{{ checksum "vcpkg.json" }}
          paths: [build_x64/vcpkg_installed]
          when: always
      - save_cache:
          key: windows-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always

workflows:
  build:
    jobs:
      - build-linux
      - build-macos
      - build-windows
