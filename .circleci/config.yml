version: 2.1

orbs:
  windows: circleci/windows@5.1.1

jobs:

  build-linux:
    machine:
      image: ubuntu-2404:current
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Checkout submodules
          command: git submodule update --init --recursive
      - restore_cache:
          keys:
            - linux-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-ccache-{{ .Branch }}-
            - linux-ccache-
      - run:
          name: Install dependencies
          command: |
            sudo add-apt-repository -y ppa:obsproject/obs-studio
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              libobs-dev \
              qt6-base-dev libqt6svg6-dev qt6-tools-dev \
              libcairo2-dev libpango1.0-dev
      - run:
          name: Configure
          command: |
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run:
          name: Build
          command: cmake --build build --parallel
      - run:
          name: Install
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - save_cache:
          key: linux-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always

  build-windows:
    executor:
      name: windows/default
      size: medium
      shell: powershell.exe
    environment:
      SCCACHE_DIR: C:\sccache
      VCPKG_ROOT: C:\vcpkg
      # Keep vcpkg's binary cache (prebuilt package archives) and source
      # downloads on stable paths *outside* C:\vcpkg so they can be cached
      # independently of the tool itself.
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
    steps:
      - checkout
      - run:
          name: Checkout submodules
          shell: bash.exe
          command: git submodule update --init --recursive
      - run:
          name: Prepare vcpkg cache dirs
          command: |
            # vcpkg refuses to use these dirs unless they already exist.
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
      - restore_cache:
          keys:
            - windows-deps-{{ checksum "buildspec.json" }}
            - windows-deps-
      - restore_cache:
          keys:
            - windows-vcpkg-tool-v1
      # Binary cache: the prebuilt package archives. This is what actually
      # lets `vcpkg install` skip re-downloading + rebuilding every run.
      # Rolling key (epoch suffix on save) so each run publishes a fresh,
      # complete cache instead of being frozen by CircleCI's immutable-cache
      # rule; the prefix fallbacks restore the most recent matching cache.
      - restore_cache:
          keys:
            - windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-
            - windows-vcpkg-archives-
      # The fully resolved install tree — restoring it makes install a no-op
      # when vcpkg.json is unchanged.
      - restore_cache:
          keys:
            - windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-
      # Source downloads, used only on a binary-cache miss.
      - restore_cache:
          keys:
            - windows-vcpkg-downloads-
      - restore_cache:
          keys:
            - windows-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-sccache-{{ .Branch }}-
            - windows-sccache-
      - run:
          name: Install build tools
          command: choco install cmake pkgconfiglite sccache -y --no-progress
      - run:
          name: Bootstrap vcpkg
          command: |
            # CircleCI's Windows image does NOT ship vcpkg (unlike GitHub runners),
            # so clone + bootstrap it ourselves into $VCPKG_ROOT.
            if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
      - save_cache:
          key: windows-vcpkg-tool-v1
          paths: [C:\vcpkg]
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet x64-windows `
              --x-manifest-root="$PWD" `
              --x-install-root="$PWD\build_x64\vcpkg_installed"
      # Persist the freshly populated binary cache, install tree and downloads
      # *after* install, with rolling keys so the new archives are actually
      # saved (CircleCI never overwrites an existing cache key).
      - save_cache:
          key: windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [C:\vcpkg-archives]
          when: always
      - save_cache:
          key: windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [build_x64/vcpkg_installed]
          when: always
      - save_cache:
          key: windows-vcpkg-downloads-{{ epoch }}
          paths: [C:\vcpkg-downloads]
          when: always
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            $env:PKG_CONFIG_PATH = "$install_dir\x64-windows\lib\pkgconfig"
            cmake -S . -B build_x64 `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$install_dir" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - run:
          name: Build
          command: cmake --build build_x64 --config RelWithDebInfo --parallel
      - run:
          name: Install
          command: cmake --install build_x64 --config RelWithDebInfo --prefix dist
      - run:
          name: sccache stats
          command: sccache --show-stats
          when: always
      - store_artifacts:
          path: dist
          destination: windows-x64
      - save_cache:
          key: windows-deps-{{ checksum "buildspec.json" }}
          paths: [.deps]
          when: always
      - save_cache:
          key: windows-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always

workflows:
  build:
    jobs:
      - build-linux
      - build-windows
