name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ubuntu:
    name: Ubuntu x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache pkg-config jq \
            libgles2-mesa-dev libsimde-dev obs-studio \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev \
            libcairo2-dev libpango1.0-dev liblua5.4-dev

      - name: Configure
        run: cmake --preset ubuntu-ci-x86_64

      - name: Build
        run: cmake --build --preset ubuntu-ci-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-graphics-for-obs-ubuntu-x86_64
          path: build_x86_64/**/*.so

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ccache cmake jq xcbeautify pkgconf cairo pango lua
          BREW_PREFIX="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset macos-ci

      - name: Build
        run: cmake --build --preset macos-ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-graphics-for-obs-macos-arm64
          path: build_macos/**/*.dylib

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          $VcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $VcpkgInstalled = "$VcpkgRoot\installed\x64-windows"
          $env:PKG_CONFIG_PATH = "$VcpkgInstalled\lib\pkgconfig"
          cmake --preset windows-ci-x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$VcpkgRoot\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DPKG_CONFIG_EXECUTABLE=$VcpkgInstalled\tools\pkgconf\pkgconf.exe"

      - name: Build
        run: cmake --build --preset windows-ci-x64 --config RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-graphics-for-obs-windows-x64
          path: build_x64/**/*.dll
